# =============================================================================
# RCC-APS — Republic Central Colleges Automated Payroll System
# CI/CD Pipeline: GitHub Actions → Vercel (Production)
#
# Job 1 (ci):     install → lint → test          (quality gate)
# Job 2 (deploy): pull → build → deploy to prod  (runs only if Job 1 passed)
#
# Trigger: every push / merge to `main` (manual runs allowed via Actions tab)
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# =============================================================================

name: CI/CD — Test & Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch: # allows manual runs from the Actions tab

# Never run two production deployments at the same time;
# if a newer push lands while one is running, the older run is cancelled.
concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1 — CONTINUOUS INTEGRATION (quality gate)
  # ---------------------------------------------------------------------------
  ci:
    name: Install, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run test suite (Jest / Vitest)
        run: npm run test
        env:
          CI: true

  # ---------------------------------------------------------------------------
  # JOB 2 — CONTINUOUS DEPLOYMENT (build & ship)
  # ---------------------------------------------------------------------------
  deploy:
    name: Build & Deploy (Production)
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment & project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build production artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt artifacts to Vercel production
        id: deploy
        run: |
          OUTPUT=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oE 'https://[a-zA-Z0-9._-]+' | tail -n 1 || true)
          echo "url=$URL" >> "$GITHUB_OUTPUT"